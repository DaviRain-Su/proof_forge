<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="280" viewBox="0 0 1100 280" role="img" aria-label="Compilation pipeline (primary path)">
  <defs>
    <filter id="s" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5c6570"/>
    </marker>
    <style>
      .t { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .title { font-size: 22px; font-weight: 700; fill: #1a1d23; }
      .sub { font-size: 13px; fill: #5c6570; }
      .b { font-size: 13px; font-weight: 600; fill: #1a1d23; }
      .s { font-size: 11px; fill: #5c6570; }
      .tiny { font-size: 10px; fill: #5c6570; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#fafbfc"/>

<text x="40" y="36" class="t title" text-anchor="start">Compilation pipeline (primary path)</text>
<text x="40" y="58" class="t sub" text-anchor="start">Lean product module → chain artifact — failures are fail-closed</text>
<rect x="40" y="100" width="140" height="100" rx="14" ry="14" fill="#d6ebff" stroke="#3b82f6" stroke-width="2" filter="url(#s)"/>
<text x="110" y="140" class="t b" text-anchor="middle">Product</text>
<text x="110" y="165" class="t s" text-anchor="middle">Counter.lean</text>
<line x1="184" y1="150" x2="236" y2="150" stroke="#5c6570" stroke-width="2" marker-end="url(#arr)"/>
<rect x="200" y="100" width="140" height="100" rx="14" ry="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" filter="url(#s)"/>
<text x="270" y="140" class="t b" text-anchor="middle">Authored</text>
<text x="270" y="165" class="t s" text-anchor="middle">normalize</text>
<line x1="344" y1="150" x2="396" y2="150" stroke="#5c6570" stroke-width="2" marker-end="url(#arr)"/>
<rect x="360" y="100" width="140" height="100" rx="14" ry="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#s)"/>
<text x="430" y="140" class="t b" text-anchor="middle">Core</text>
<text x="430" y="165" class="t s" text-anchor="middle">validate</text>
<line x1="504" y1="150" x2="556" y2="150" stroke="#5c6570" stroke-width="2" marker-end="url(#arr)"/>
<rect x="520" y="100" width="140" height="100" rx="14" ry="14" fill="#fef9c3" stroke="#ca8a04" stroke-width="2" filter="url(#s)"/>
<text x="590" y="140" class="t b" text-anchor="middle">Caps</text>
<text x="590" y="165" class="t s" text-anchor="middle">CapabilityPlan</text>
<line x1="664" y1="150" x2="716" y2="150" stroke="#5c6570" stroke-width="2" marker-end="url(#arr)"/>
<rect x="680" y="100" width="140" height="100" rx="14" ry="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2" filter="url(#s)"/>
<text x="750" y="140" class="t b" text-anchor="middle">Plan</text>
<text x="750" y="165" class="t s" text-anchor="middle">EVM/Sol/Near</text>
<line x1="824" y1="150" x2="876" y2="150" stroke="#5c6570" stroke-width="2" marker-end="url(#arr)"/>
<rect x="840" y="100" width="140" height="100" rx="14" ry="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" filter="url(#s)"/>
<text x="910" y="140" class="t b" text-anchor="middle">Artifact</text>
<text x="910" y="165" class="t s" text-anchor="middle">bin / so / wasm</text>
<text x="40" y="250" class="t s" text-anchor="start">CLI: lake env proof-forge build --target &lt;id&gt; -o out/ Examples/Product/….lean</text>
</svg>
