<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-label="同一产品源 · 三个目标">
  <defs>
    <filter id="s" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5c6570"/>
    </marker>
    <style>
      .t { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .title { font-size: 22px; font-weight: 700; fill: #1a1d23; }
      .sub { font-size: 13px; fill: #5c6570; }
      .b { font-size: 13px; font-weight: 600; fill: #1a1d23; }
      .s { font-size: 11px; fill: #5c6570; }
      .tiny { font-size: 10px; fill: #5c6570; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#fafbfc"/>

<text x="40" y="36" class="t title" text-anchor="start">同一产品源 · 三个目标</text>
<text x="40" y="58" class="t sub" text-anchor="start">只改 --target；业务逻辑不复制</text>
<rect x="320" y="90" width="360" height="70" rx="14" ry="14" fill="#d6ebff" stroke="#3b82f6" stroke-width="2" filter="url(#s)"/>
<text x="500" y="120" class="t b" text-anchor="middle">Examples/Product/Counter.lean</text>
<text x="500" y="140" class="t s" text-anchor="middle">contract_source · 可移植业务</text>
<rect x="350" y="200" width="300" height="50" rx="12" ry="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#s)"/>
<text x="500" y="230" class="t b" text-anchor="middle">Checked Canonical Core</text>
<line x1="500" y1="160" x2="500" y2="196" stroke="#5c6570" stroke-width="2" marker-end="url(#arr)"/>
<line x1="500" y1="250" x2="200" y2="290" stroke="#5c6570" stroke-width="2" marker-end="url(#arr)"/>
<rect x="60" y="290" width="280" height="100" rx="12" ry="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2" filter="url(#s)"/>
<text x="200" y="320" class="t b" text-anchor="middle">evm</text>
<text x="200" y="342" class="t s" text-anchor="middle">ModulePlan → Yul → solc</text>
<text x="200" y="364" class="t tiny" text-anchor="middle">Anvil / Foundry</text>
<line x1="500" y1="250" x2="490" y2="290" stroke="#5c6570" stroke-width="2" marker-end="url(#arr)"/>
<rect x="350" y="290" width="280" height="100" rx="12" ry="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2" filter="url(#s)"/>
<text x="490" y="320" class="t b" text-anchor="middle">solana-sbpf-asm</text>
<text x="490" y="342" class="t s" text-anchor="middle">SolanaModulePlan → sBPF → ELF</text>
<text x="490" y="364" class="t tiny" text-anchor="middle">Mollusk / Pinocchio</text>
<line x1="500" y1="250" x2="780" y2="290" stroke="#5c6570" stroke-width="2" marker-end="url(#arr)"/>
<rect x="640" y="290" width="280" height="100" rx="12" ry="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2" filter="url(#s)"/>
<text x="780" y="320" class="t b" text-anchor="middle">wasm-near</text>
<text x="780" y="342" class="t s" text-anchor="middle">NearModulePlan → WAT → wasm</text>
<text x="780" y="364" class="t tiny" text-anchor="middle">offline host / near-vm</text>
