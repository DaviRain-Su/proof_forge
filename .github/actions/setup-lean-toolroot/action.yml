name: setup-lean-toolroot
description: Install Lean, just, optional ripgrep; optionally materialize linux tool root with cache
inputs:
  install-ripgrep:
    description: Install ripgrep via apt
    required: false
    default: "false"
  provision-tool-root:
    description: Materialize and verify the external linux tool root
    required: false
    default: "true"
  tool-root:
    description: Absolute PROOF_FORGE_TOOL_ROOT path
    required: true
  cache-key-suffix:
    description: Extra suffix for Lake cache key (optional; empty skips Lake cache)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install just
      uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145  # v2.83.1
      with:
        tool: just@1.48.0

    - name: Install ripgrep
      if: inputs.install-ripgrep == 'true'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y ripgrep

    - name: Install Lean
      shell: bash
      run: |
        scripts/ci/install-lean.sh
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

    - name: Export tool root
      shell: bash
      run: echo "PROOF_FORGE_TOOL_ROOT=${{ inputs.tool-root }}" >> "$GITHUB_ENV"

    - name: Cache linux tool root
      id: tool-root-cache
      if: inputs.provision-tool-root == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
      with:
        path: ${{ inputs.tool-root }}
        key: ${{ runner.os }}-toolroot-${{ hashFiles('toolchains-linux-x86_64.lock.json', 'toolchains.lock.json', 'host-profiles.lock.json', 'host-bootstrap-linux.lock') }}

    - name: Provision linux external assets
      if: inputs.provision-tool-root == 'true' && steps.tool-root-cache.outputs.cache-hit != 'true'
      shell: bash
      run: just toolchains-provision-external

    - name: Materialize linux tool root
      if: inputs.provision-tool-root == 'true' && steps.tool-root-cache.outputs.cache-hit != 'true'
      shell: bash
      run: just toolchains-materialize-external "$PROOF_FORGE_TOOL_ROOT"

    - name: Verify linux tool root
      if: inputs.provision-tool-root == 'true'
      shell: bash
      run: just toolchains-verify-external

    - name: Cache Lake build products
      if: inputs.cache-key-suffix != ''
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
      with:
        path: |
          .lake/build
          .lake/packages
        key: ${{ runner.os }}-lake-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-${{ inputs.cache-key-suffix }}
        restore-keys: |
          ${{ runner.os }}-lake-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-
          ${{ runner.os }}-lake-v2-

    - name: Prune stale olean artifacts
      if: inputs.cache-key-suffix != ''
      shell: bash
      run: /usr/bin/python3 -I -S scripts/ci/prune_stale_oleans.py
