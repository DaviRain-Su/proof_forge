name: CI

# ProofForge V2 portable CI (Linux).
#
# Required lanes for branch protection:
#   docs         - documentation control-plane check
#   source-core  - Lean build, unit tests, ProgramV1/target negative gates
#
# Manual audit lane:
#   linux-tool-root - explicit toolchain lock/provision/materialize inspection.
#   It is not part of ordinary push/PR completion and never creates formal EV.
#
# Not run by hosted product CI:
#   governance-check, release-check, Stage-0, SBOM ceremony, custody,
#   clean-room qualification, or target-smoke with locked external tools.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install just
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145  # v2.83.1
        with:
          tool: just@1.48.0

      - name: Documentation control plane
        run: just docs-check

      - name: Whitespace / conflict markers
        run: git diff --check

  source-core:
    name: source-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install just
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145  # v2.83.1
        with:
          tool: just@1.48.0

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      # The Lean-bundled clang is built against Lean's self-contained sysroot
      # and does not probe the distro gcc include layout: compiling the native
      # frontend .c fails with 'stddef.h file not found' (stddef.h lives in the
      # gcc private include dir on Ubuntu), and forcing the gcc headers in via
      # CPATH breaks on gcc's stdatomic.h macros. The supported alternative is
      # LEAN_CC pointing at the distro clang (resolves libc headers natively),
      # plus the distro libc++/libuv development libraries for the final link.
      - name: Provision C toolchain headers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libc++-dev libc++abi-dev libuv1-dev
          echo "LEAN_CC=/usr/bin/clang" >> "$GITHUB_ENV"

      - name: Install Lean
        run: |
          scripts/ci/install-lean.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          lean --version
          lake --version
          just --version
          rg --version
          python3 --version

      - name: Cache Lake build products
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            .lake/build
            .lake/packages
          key: ${{ runner.os }}-lake-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}
          restore-keys: |
            ${{ runner.os }}-lake-v2-

      - name: Portable source-core gate
        run: just ci

  linux-tool-root:
    name: linux-tool-root (manual audit)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install just
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145  # v2.83.1
        with:
          tool: just@1.48.0

      - name: Select linux tool root
        run: echo "PROOF_FORGE_TOOL_ROOT=$RUNNER_TEMP/proof-forge-v2/tool-root/linux-x86_64" >> "$GITHUB_ENV"

      - name: Validate per-platform locks
        run: /usr/bin/python3 -I -S scripts/toolchain_assets.py validate

      - name: Toolchain self-test
        run: /usr/bin/python3 -I -S scripts/toolchain_assets.py self-test

      - name: Host profiles self-test
        run: /usr/bin/python3 -I -S scripts/host_profiles_self_test.py

      - name: Provision linux external assets
        run: just toolchains-provision-external

      - name: Materialize linux tool root
        run: just toolchains-materialize-external "$PROOF_FORGE_TOOL_ROOT"

      - name: Verify linux tool root
        run: just toolchains-verify-external

      - name: Observe host and validate development profile
        run: |
          mkdir -p build/host-profile
          /usr/bin/python3 -I -S scripts/toolchain_assets.py observe-host \
            --profile-id "ci-linux-$(uname -m)-development" \
            > build/host-profile/observed-profile.json
          /usr/bin/python3 -I -S scripts/toolchain_assets.py validate-host-profile \
            --input build/host-profile/observed-profile.json
