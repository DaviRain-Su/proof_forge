name: CI

# ProofForge V2 portable CI (Linux).
#
# Required lanes for branch protection (BUILD-4 independent fail isolation):
#   docs            - documentation control-plane check (always)
#   lean-product    - nine non-target test shards, product-negative, deletion gates
#   target-smoke    - three parallel target shards (evm / solana-lean / host+zk)
#                     + target CLI positive/negative checks
#   solana-runtime  - Mollusk runtime differential
#
# Path filter (scripts/ci/detect_ci_paths.sh):
#   * push to main/master, workflow_dispatch → all heavy lanes
#   * PR / feature push → skip heavy lanes when only docs/templates/MCP content
#     changed; Solana-only paths can skip lean-product when safe, etc.
#   * Filter is fail-closed: unknown paths still run lean-product.
#
# Targets suite split (wall-clock):
#   just test-targets runs targets-evm + targets-solana + targets-host in
#   parallel processes (PROOF_FORGE_TEST_JOBS). Aggregate
#   proof-forge-next-tests-shard-targets remains for one-shot local debug.
#
# Manual audit lane:
#   linux-tool-root - explicit toolchain lock/provision/materialize inspection.
#   It is not part of ordinary push/PR completion and never creates formal EV.
#
# Not run by hosted product CI:
#   governance-check, release-check, Stage-0, SBOM ceremony, custody,
#   clean-room qualification, or target-smoke with locked external tools.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      lean_product: ${{ steps.detect.outputs.lean_product }}
      target_smoke: ${{ steps.detect.outputs.target_smoke }}
      solana_runtime: ${{ steps.detect.outputs.solana_runtime }}
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0

      - name: Detect CI path classes
        id: detect
        run: bash scripts/ci/detect_ci_paths.sh

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install just
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145  # v2.83.1
        with:
          tool: just@1.48.0

      - name: Documentation control plane
        run: just docs-check

      - name: CI path-filter self-test
        run: just ci-path-detect-self-test

      - name: Whitespace / conflict markers
        run: git diff --check

  # Shared Lean/tool setup is duplicated across lean-product / target-smoke /
  # solana-runtime so each job can fail independently (BUILD-4). Cache restore
  # keys share the lake-v2 prefix so cold starts still hit sibling job artifacts.
  lean-product:
    name: lean-product
    needs: changes
    if: needs.changes.outputs.lean_product == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install just
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145  # v2.83.1
        with:
          tool: just@1.48.0

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install Lean
        run: |
          scripts/ci/install-lean.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Select linux tool root
        run: echo "PROOF_FORGE_TOOL_ROOT=$RUNNER_TEMP/proof-forge-v2/tool-root/linux-x86_64" >> "$GITHUB_ENV"

      - name: Provision linux external assets
        run: just toolchains-provision-external

      - name: Materialize linux tool root
        run: just toolchains-materialize-external "$PROOF_FORGE_TOOL_ROOT"

      - name: Verify linux tool root
        run: just toolchains-verify-external

      - name: Tool versions
        run: |
          lean --version
          lake --version
          just --version
          rg --version
          python3 --version

      - name: Cache Lake build products
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            .lake/build
            .lake/packages
          key: ${{ runner.os }}-lake-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-lean-product
          restore-keys: |
            ${{ runner.os }}-lake-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-
            ${{ runner.os }}-lake-v2-

      - name: Prune stale olean artifacts
        run: /usr/bin/python3 -I -S scripts/ci/prune_stale_oleans.py

      - name: Lean non-target shards
        env:
          PROOF_FORGE_TEST_JOBS: "9"
        run: just test-nontarget

      - name: Lean product and deletion gates
        run: just ci-lean-gates

  target-smoke:
    name: target-smoke
    needs: changes
    if: needs.changes.outputs.target_smoke == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install just
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145  # v2.83.1
        with:
          tool: just@1.48.0

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install Lean
        run: |
          scripts/ci/install-lean.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Select linux tool root
        run: echo "PROOF_FORGE_TOOL_ROOT=$RUNNER_TEMP/proof-forge-v2/tool-root/linux-x86_64" >> "$GITHUB_ENV"

      - name: Provision linux external assets
        run: just toolchains-provision-external

      - name: Materialize linux tool root
        run: just toolchains-materialize-external "$PROOF_FORGE_TOOL_ROOT"

      - name: Verify linux tool root
        run: just toolchains-verify-external

      - name: Cache Lake build products
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            .lake/build
            .lake/packages
          key: ${{ runner.os }}-lake-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-target-smoke
          restore-keys: |
            ${{ runner.os }}-lake-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-
            ${{ runner.os }}-lake-v2-

      - name: Prune stale olean artifacts
        run: /usr/bin/python3 -I -S scripts/ci/prune_stale_oleans.py

      - name: Parallel target shards (evm / solana-lean / host+zk)
        env:
          # Three processes; keep modest parallelism on 2-core runners.
          PROOF_FORGE_TEST_JOBS: "3"
        run: just test-targets

      - name: Target CLI and NFR smoke
        run: just ci-target-cli-smoke

  # BUILD-4: Solana Mollusk runtime is a separate job so Lean product CI failures
  # surface without waiting on Rust, and Solana failures do not hide Lean green.
  solana-runtime:
    name: solana-runtime
    needs: changes
    if: needs.changes.outputs.solana_runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install just
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145  # v2.83.1
        with:
          tool: just@1.48.0

      - name: Install Lean
        run: |
          scripts/ci/install-lean.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Select linux tool root
        run: echo "PROOF_FORGE_TOOL_ROOT=$RUNNER_TEMP/proof-forge-v2/tool-root/linux-x86_64" >> "$GITHUB_ENV"

      - name: Provision linux external assets
        run: just toolchains-provision-external

      - name: Materialize linux tool root
        run: just toolchains-materialize-external "$PROOF_FORGE_TOOL_ROOT"

      - name: Verify linux tool root
        run: just toolchains-verify-external

      - name: Cache Lake build products
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            .lake/build
            .lake/packages
          key: ${{ runner.os }}-lake-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-solana-runtime
          restore-keys: |
            ${{ runner.os }}-lake-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-
            ${{ runner.os }}-lake-v2-

      - name: Prune stale olean artifacts
        run: /usr/bin/python3 -I -S scripts/ci/prune_stale_oleans.py

      - name: Build product CLI
        run: just build

      - name: Install Rust toolchain
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustc --version
          cargo --version

      - name: Solana Mollusk runtime differential (S3a)
        run: just solana-runtime

  linux-tool-root:
    name: linux-tool-root (manual audit)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install just
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145  # v2.83.1
        with:
          tool: just@1.48.0

      - name: Select linux tool root
        run: echo "PROOF_FORGE_TOOL_ROOT=$RUNNER_TEMP/proof-forge-v2/tool-root/linux-x86_64" >> "$GITHUB_ENV"

      - name: Validate per-platform locks
        run: /usr/bin/python3 -I -S scripts/toolchain_assets.py validate

      - name: Toolchain self-test
        run: /usr/bin/python3 -I -S scripts/toolchain_assets.py self-test

      - name: Host profiles self-test
        run: /usr/bin/python3 -I -S scripts/host_profiles_self_test.py

      - name: Provision linux external assets
        run: just toolchains-provision-external

      - name: Materialize linux tool root
        run: just toolchains-materialize-external "$PROOF_FORGE_TOOL_ROOT"

      - name: Verify linux tool root
        run: just toolchains-verify-external

      - name: Observe host and validate development profile
        run: |
          mkdir -p build/host-profile
          /usr/bin/python3 -I -S scripts/toolchain_assets.py observe-host \
            --profile-id "ci-linux-$(uname -m)-development" \
            > build/host-profile/observed-profile.json
          /usr/bin/python3 -I -S scripts/toolchain_assets.py validate-host-profile \
            --input build/host-profile/observed-profile.json
