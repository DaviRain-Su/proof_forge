name: WasmCert provider candidates

# Manual, non-activating build observation for the pinned ProofForge provider.
# The uploaded candidates are NOT Tool Lock assets and do not activate product
# execution. Admission remains a separate reviewed change after both platform
# runtime closures and hashes have been inspected.

on:
  workflow_dispatch:

concurrency:
  group: wasmcert-provider-candidates-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  candidate:
    name: candidate (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            # Build against the older supported glibc baseline; ubuntu-latest
            # currently emits GLIBC_2.38 requirements that fail on Debian 12.
            runner: ubuntu-22.04
          - platform: darwin-arm64
            runner: macos-14
    env:
      WASMCERT_OPAM_SWITCH: pf-wasmcert
      WASMCERT_REVISION: 9ab0f87f03fff5507749efc273ec662fe27e6d14
    steps:
      - name: Checkout ProofForge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install native build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          echo "OPAMROOT=$RUNNER_TEMP/proof-forge-wasmcert-opam" >> "$GITHUB_ENV"
          case "${{ matrix.platform }}" in
            linux-x86_64)
              sudo apt-get update
              sudo apt-get install -y libgmp-dev opam pkg-config
              ;;
            darwin-arm64)
              export HOMEBREW_NO_AUTO_UPDATE=1
              brew install gmp opam pkg-config
              ;;
            *) exit 2 ;;
          esac
          opam --version
          python3 --version

      - name: Create exact OCaml package switch
        shell: bash
        run: |
          set -euo pipefail
          opam init --bare --disable-sandboxing --no-setup --yes
          opam repository add rocq-released https://rocq-prover.org/opam/released \
            --set-default --yes
          opam switch create "$WASMCERT_OPAM_SWITCH" ocaml-base-compiler.4.14.2 --yes --jobs=2 \
            --repositories=rocq-released,default
          packages=()
          while read -r package version; do
            packages+=("$package.$version")
          done < <(
            awk '!/^#/ && NF == 2 { print $1, $2 }' \
              tools/wasmcert-provider/opam-packages.v1.lock
          )
          opam install --switch "$WASMCERT_OPAM_SWITCH" --yes --jobs=2 "${packages[@]}"
          opam list --switch "$WASMCERT_OPAM_SWITCH" --installed --short --columns=name,version \
            > "$RUNNER_TEMP/wasmcert-installed-packages.txt"
          opam repository list --all | tee "$RUNNER_TEMP/wasmcert-opam-repository-list.txt"
          python3 -I -S - "$OPAMROOT" \
            "$RUNNER_TEMP/wasmcert-opam-repository-list.txt" \
            "$RUNNER_TEMP/wasmcert-opam-repositories.json" <<'PY'
          import hashlib
          import json
          import pathlib
          import stat
          import sys

          root = pathlib.Path(sys.argv[1]).resolve(strict=True)
          repository_list = pathlib.Path(sys.argv[2])
          output = pathlib.Path(sys.argv[3])
          repo_root = root / "repo"
          expected = [
              ("default", "https://opam.ocaml.org"),
              ("rocq-released", "https://rocq-prover.org/opam/released"),
          ]

          observed_origins = {}
          for number, raw in enumerate(repository_list.read_text(encoding="utf-8").splitlines(), 1):
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              fields = line.split()
              if len(fields) < 2 or fields[0] in observed_origins:
                  raise SystemExit(f"invalid opam repository list row {number}: {raw!r}")
              observed_origins[fields[0]] = fields[1]
          if observed_origins != dict(expected):
              raise SystemExit(
                  f"opam repository name/origin inventory differs: {observed_origins!r}"
              )

          def file_sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def tree_descriptor(name, directory):
              digest = hashlib.sha256()
              file_count = 0
              total_size = 0
              for path in sorted(directory.rglob("*"), key=lambda p: p.relative_to(directory).as_posix().encode("utf-8")):
                  metadata = path.lstat()
                  if stat.S_ISDIR(metadata.st_mode):
                      continue
                  if not stat.S_ISREG(metadata.st_mode) or path.is_symlink():
                      raise SystemExit(f"repository tree contains a non-regular leaf: {path}")
                  relative = path.relative_to(directory).as_posix().encode("utf-8")
                  content_sha256 = bytes.fromhex(file_sha256(path))
                  digest.update(len(relative).to_bytes(8, "big"))
                  digest.update(relative)
                  digest.update(metadata.st_size.to_bytes(8, "big"))
                  digest.update(content_sha256)
                  file_count += 1
                  total_size += metadata.st_size
              if file_count == 0:
                  raise SystemExit(f"repository tree is empty: {directory}")
              return {
                  "fileCount": file_count,
                  "path": f"repo/{name}",
                  "sha256": digest.hexdigest(),
                  "size": total_size,
                  "storage": "canonical-file-tree-v1",
              }

          repositories = []
          for name, url in expected:
              archive = repo_root / f"{name}.tar.gz"
              directory = repo_root / name
              if archive.is_file() and not archive.is_symlink():
                  descriptor = {
                      "fileCount": 1,
                      "path": f"repo/{name}.tar.gz",
                      "sha256": file_sha256(archive),
                      "size": archive.stat().st_size,
                      "storage": "archive-bytes-v1",
                  }
              elif directory.is_dir() and not directory.is_symlink():
                  descriptor = tree_descriptor(name, directory)
              else:
                  observed = sorted(path.name for path in repo_root.iterdir())
                  raise SystemExit(
                      f"opam repository snapshot is absent for {name}; repo entries={observed}"
                  )
              descriptor.update({"name": name, "url": url})
              repositories.append(descriptor)

          config = repo_root / "repos-config"
          if not config.is_file() or config.is_symlink():
              raise SystemExit("opam repos-config is not a regular file")
          observation = {
              "canonicalTreeDigest": "sha256(u64be(pathLen)||pathUtf8||u64be(size)||sha256(content))*",
              "reposConfigSha256": file_sha256(config),
              "repositories": repositories,
              "schema": "proof-forge.opam-repository-observation.v1",
          }
          output.write_text(
              json.dumps(observation, ensure_ascii=False, separators=(",", ":"), sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Fetch exact WasmCert source
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/WasmCert-Coq"
          git init "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/WasmCert/WasmCert-Coq
          git -C "$source_dir" fetch --depth=1 origin "$WASMCERT_REVISION"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$WASMCERT_REVISION"
          test -z "$(git -C "$source_dir" status --short)"

      - name: Build twice and require identical executable bytes
        shell: bash
        run: |
          set -euo pipefail
          scripts/build_wasmcert_provider_v1.sh \
            --source "$RUNNER_TEMP/WasmCert-Coq" \
            --opam-root "$OPAMROOT" \
            --switch "$WASMCERT_OPAM_SWITCH" \
            --output "$RUNNER_TEMP/proof-forge-wasmcert-provider-v1" \
            --repeat-check | tee "$RUNNER_TEMP/wasmcert-repeat-build.txt"

      - name: Package non-activating candidate and runtime closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/wasmcert-candidates
          proof_forge_revision="$(git rev-parse HEAD)"
          opam_version="$(opam --version)"
          ocaml_version="$(opam exec --switch "$WASMCERT_OPAM_SWITCH" -- ocamlc -version)"
          dune_version="$(opam exec --switch "$WASMCERT_OPAM_SWITCH" -- dune --version)"
          candidate="build/wasmcert-candidates/proof-forge-wasmcert-provider-v1-${{ matrix.platform }}"
          python3 -I -S scripts/package_wasmcert_provider_candidate_v1.py \
            --provider "$RUNNER_TEMP/proof-forge-wasmcert-provider-v1" \
            --platform "${{ matrix.platform }}" \
            --proof-forge-revision "$proof_forge_revision" \
            --installed-packages "$RUNNER_TEMP/wasmcert-installed-packages.txt" \
            --opam-repositories "$RUNNER_TEMP/wasmcert-opam-repositories.json" \
            --repeat-build-report "$RUNNER_TEMP/wasmcert-repeat-build.txt" \
            --opam-version "$opam_version" \
            --ocaml-version "$ocaml_version" \
            --dune-version "$dune_version" \
            --output "$candidate"
          COPYFILE_DISABLE=1 tar -czf "$candidate.tar.gz" \
            -C "$(dirname "$candidate")" "$(basename "$candidate")"
          python3 -I -S - "$candidate.tar.gz" > "$candidate.tar.gz.sha256" <<'PY'
          import hashlib
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          print(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          PY

      - name: Upload candidate observation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wasmcert-provider-candidate-${{ matrix.platform }}
          path: |
            build/wasmcert-candidates/*.tar.gz
            build/wasmcert-candidates/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
