name: CI nightly

# Full ordinary-host product matrix. Not branch-protection required.
# Complements path-filtered PR CI with:
#   * targets-host-slow (CosmWasmPlan + NoirAcir)
#   * full just test-targets with HOST_SLOW
#   * solana-runtime always
#   * external-author smoke optional (reuse workflow)

on:
  schedule:
    # 08:00 UTC daily
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: ci-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly-lean-product:
    name: nightly-lean-product
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Setup Lean (zero-tool lane)
        uses: ./.github/actions/setup-lean-toolroot
        with:
          install-ripgrep: "true"
          provision-tool-root: "false"
          tool-root: ${{ runner.temp }}/proof-forge-v2/tool-root/linux-x86_64
          cache-key-suffix: nightly-lean

      - name: Lean zero-tool non-target/product shards
        env:
          PROOF_FORGE_TEST_JOBS: "1"
        run: just test-nontarget

      - name: Lean product and deletion gates
        run: just ci-lean-gates

      - name: Upload proof-forge-next CLI
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: nightly-proof-forge-next-cli
          path: .lake/build/bin/proof-forge-next
          if-no-files-found: error
          retention-days: 3

  nightly-targets:
    name: nightly-targets
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Setup Lean + tool root
        uses: ./.github/actions/setup-lean-toolroot
        with:
          install-ripgrep: "true"
          tool-root: ${{ runner.temp }}/proof-forge-v2/tool-root/linux-x86_64
          cache-key-suffix: nightly-targets

      - name: All target shards including host-slow
        env:
          PROOF_FORGE_TEST_JOBS: "4"
          PROOF_FORGE_TARGET_HOST_SLOW: "1"
        run: just test-targets

      - name: Target CLI, source-bound, and NFR smoke
        run: just ci-target-cli-smoke

  nightly-solana-runtime:
    name: nightly-solana-runtime
    needs: [nightly-lean-product]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Setup Lean + tool root
        uses: ./.github/actions/setup-lean-toolroot
        with:
          tool-root: ${{ runner.temp }}/proof-forge-v2/tool-root/linux-x86_64
          cache-key-suffix: ""

      - name: Download CLI
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: nightly-proof-forge-next-cli
          path: .lake/build/bin

      - name: Prepare CLI env
        run: |
          mkdir -p .lake/build/bin
          chmod +x .lake/build/bin/proof-forge-next
          echo "PROOF_FORGE_CLI=$PWD/.lake/build/bin/proof-forge-next" >> "$GITHUB_ENV"
          echo "PROOF_FORGE_SKIP_LAKE_BUILD=1" >> "$GITHUB_ENV"

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime-tests/solana/target
          key: ${{ runner.os }}-cargo-solana-${{ hashFiles('runtime-tests/solana/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-solana-

      - name: Install Rust toolchain
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustc --version
          cargo --version

      - name: Solana Mollusk runtime differential
        run: just solana-runtime

  nightly-near-runtime:
    name: nightly-near-runtime
    needs: [nightly-lean-product]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Setup Lean + tool root
        uses: ./.github/actions/setup-lean-toolroot
        with:
          tool-root: ${{ runner.temp }}/proof-forge-v2/tool-root/linux-x86_64
          cache-key-suffix: ""

      - name: Download CLI
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: nightly-proof-forge-next-cli
          path: .lake/build/bin

      - name: Prepare CLI env
        run: |
          mkdir -p .lake/build/bin
          chmod +x .lake/build/bin/proof-forge-next
          echo "PROOF_FORGE_CLI=$PWD/.lake/build/bin/proof-forge-next" >> "$GITHUB_ENV"
          echo "PROOF_FORGE_SKIP_LAKE_BUILD=1" >> "$GITHUB_ENV"

      - name: Install Python deps for near-sandbox harness
        run: |
          python3 -m pip install --user -q -r runtime-tests/near/requirements.txt

      - name: NEAR near-sandbox runtime differential
        run: just near-runtime
        env:
          PF_NEAR_RUNTIME_REQUIRED: "1"

  nightly-cosmwasm-runtime:
    name: nightly-cosmwasm-runtime
    needs: [nightly-lean-product]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Setup Lean + tool root
        uses: ./.github/actions/setup-lean-toolroot
        with:
          tool-root: ${{ runner.temp }}/proof-forge-v2/tool-root/linux-x86_64
          cache-key-suffix: ""

      - name: Download CLI
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: nightly-proof-forge-next-cli
          path: .lake/build/bin

      - name: Prepare CLI env
        run: |
          mkdir -p .lake/build/bin
          chmod +x .lake/build/bin/proof-forge-next
          echo "PROOF_FORGE_CLI=$PWD/.lake/build/bin/proof-forge-next" >> "$GITHUB_ENV"
          echo "PROOF_FORGE_SKIP_LAKE_BUILD=1" >> "$GITHUB_ENV"

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime-tests/cosmwasm/target
          key: ${{ runner.os }}-cargo-cosmwasm-${{ hashFiles('runtime-tests/cosmwasm/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cosmwasm-

      - name: Install Rust toolchain
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustc --version
          cargo --version

      - name: CosmWasm cosmwasm-vm runtime differential
        run: just cosmwasm-runtime
        env:
          PF_COSMWASM_RUNTIME_REQUIRED: "1"
