name: External author smoke

# Lightweight gate for ADR-0039 external-author path.
# Does NOT replace ordinary CI lean-product / target-smoke.
# NOT formal Stage-0 / hermetic.
#
# On push/PR: only cheap script + Rust unit checks (no full lake rebuild).
# On workflow_dispatch / release-adjacent: full bundle → install → pf new → build
# when a prebuilt proof-forge-next is available (same runner as package).

on:
  push:
    paths:
      - "clients/pf-cli/**"
      - "scripts/package_bundle_dist.sh"
      - "scripts/package_bundle_dist_smoke.sh"
      - "scripts/external_author_dist_smoke.sh"
      - "scripts/install.sh"
      - "scripts/pf_evm_test.sh"
      - "docs/product/14-external-author-mvp.md"
      - ".github/workflows/external-author-smoke.yml"
      - ".github/workflows/release-engineering-dist.yml"
  pull_request:
    paths:
      - "clients/pf-cli/**"
      - "scripts/package_bundle_dist.sh"
      - "scripts/package_bundle_dist_smoke.sh"
      - "scripts/external_author_dist_smoke.sh"
      - "scripts/install.sh"
      - "scripts/pf_evm_test.sh"
      - "docs/product/14-external-author-mvp.md"
      - ".github/workflows/external-author-smoke.yml"
  workflow_dispatch:

concurrency:
  group: external-author-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pf-cli-unit:
    name: pf-cli unit + resolve smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: pf-cli tests
        run: cargo test --manifest-path clients/pf-cli/Cargo.toml --locked

      - name: VERSION alignment gate
        run: |
          set -euo pipefail
          V="$(tr -d '[:space:]' < VERSION)"
          C="$(awk -F'"' '/^version = / { print $2; exit }' clients/pf-cli/Cargo.toml)"
          test "$V" = "$C" || { echo "VERSION=$V pf Cargo=$C mismatch" >&2; exit 1; }

      - name: install.sh / package scripts syntax
        run: |
          set -euo pipefail
          bash -n scripts/install.sh
          bash -n scripts/package_bundle_dist.sh
          bash -n scripts/package_bundle_dist_smoke.sh
          bash -n scripts/external_author_dist_smoke.sh
          bash -n scripts/pf_evm_test.sh

      - name: pf_evm_test.sh is package-required
        run: |
          set -euo pipefail
          # Bundle packager must list pf_evm_test.sh as required (P1-1).
          rg -n 'pf_evm_test\.sh' scripts/package_bundle_dist.sh
          rg -n 'required_scripts=\(' -A20 scripts/package_bundle_dist.sh | rg -q 'pf_evm_test\.sh'

  # Full path needs a built compiler; run when manually dispatched or on tags.
  # Release workflow already runs external_author_dist_smoke after packaging.
  bundle-path-dispatch:
    name: bundle path (dispatch / tag)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install just
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145  # v2.83.1
        with:
          tool: just@1.48.0

      - name: Install Lean
        run: |
          scripts/ci/install-lean.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build compiler
        run: lake build proof_forge_next

      - name: External-author dist smoke (aleo, hostMode=dev)
        env:
          PROOF_FORGE_HOST_MODE: dev
          PROOF_FORGE_EA_TARGET: aleo
        run: bash scripts/external_author_dist_smoke.sh
