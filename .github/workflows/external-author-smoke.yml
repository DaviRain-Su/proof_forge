name: External author smoke

# Lightweight gate for ADR-0040 external-author path.
# Does NOT replace ordinary CI lean-product / target-smoke.
# NOT formal Stage-0 / hermetic.
#
# On push/PR: cheap multi-distro script + Rust unit checks (no full lake rebuild).
# On workflow_dispatch / tags: full bundle → install → pf new → build.

on:
  push:
    paths:
      - "clients/pf-cli/**"
      - "scripts/package_bundle_dist.sh"
      - "scripts/package_bundle_dist_smoke.sh"
      - "scripts/external_author_dist_smoke.sh"
      - "scripts/install.sh"
      - "scripts/pf_evm_test.sh"
      - "scripts/pf_solana_test.sh"
      - "docs/product/14-external-author-mvp.md"
      - "docs/product/16-external-author-cheatsheet.md"
      - "docs/adr/0040-external-author-host-mode-and-bundle.md"
      - ".github/workflows/external-author-smoke.yml"
      - ".github/workflows/release-engineering-dist.yml"
  pull_request:
    paths:
      - "clients/pf-cli/**"
      - "scripts/package_bundle_dist.sh"
      - "scripts/package_bundle_dist_smoke.sh"
      - "scripts/external_author_dist_smoke.sh"
      - "scripts/install.sh"
      - "scripts/pf_evm_test.sh"
      - "scripts/pf_solana_test.sh"
      - "docs/product/14-external-author-mvp.md"
      - "docs/product/16-external-author-cheatsheet.md"
      - ".github/workflows/external-author-smoke.yml"
  workflow_dispatch:

concurrency:
  group: external-author-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pf-cli-unit:
    name: pf-cli unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: pf-cli tests
        run: cargo test --manifest-path clients/pf-cli/Cargo.toml --locked

      - name: VERSION alignment gate
        run: |
          set -euo pipefail
          V="$(tr -d '[:space:]' < VERSION)"
          C="$(awk -F'"' '/^version = / { print $2; exit }' clients/pf-cli/Cargo.toml)"
          test "$V" = "$C" || { echo "VERSION=$V pf Cargo=$C mismatch" >&2; exit 1; }

      - name: install.sh / package scripts syntax
        run: |
          set -euo pipefail
          bash -n scripts/install.sh
          bash -n scripts/package_bundle_dist.sh
          bash -n scripts/package_bundle_dist_smoke.sh
          bash -n scripts/external_author_dist_smoke.sh
          bash -n scripts/pf_evm_test.sh
          bash -n scripts/pf_solana_test.sh
          bash -n scripts/pf_near_test.sh
          bash -n scripts/pf_cosmwasm_test.sh
          bash -n scripts/pf_near_run.sh

      - name: bundle packager requires EA scripts + templates
        run: |
          set -euo pipefail
          rg -n 'required_scripts=\(' -A30 scripts/package_bundle_dist.sh | rg -q 'pf_evm_test\.sh'
          rg -n 'required_scripts=\(' -A30 scripts/package_bundle_dist.sh | rg -q 'pf_solana_test\.sh'
          rg -n 'required_scripts=\(' -A30 scripts/package_bundle_dist.sh | rg -q 'pf_near_test\.sh'
          rg -n 'required_scripts=\(' -A30 scripts/package_bundle_dist.sh | rg -q 'pf_cosmwasm_test\.sh'
          rg -n 'templates/' scripts/package_bundle_dist.sh | head -1
          test -f docs/adr/0040-external-author-host-mode-and-bundle.md
          test -f docs/product/16-external-author-cheatsheet.md

      - name: hostMode default is dev (source pin)
        run: |
          set -euo pipefail
          # Engineering default must not require hermetic host lock on foreign distros.
          rg -n 'none => pure \.dev' ProofForgeV2/Materialization/LockedToolchainV1.lean
          rg -n 'inductive HostMode' ProofForgeV2/Materialization/LockedToolchainV1.lean

  # Debian-like container: no Lean rebuild; prove scripts + pf unit on non-Mint.
  # Note: debian:bookworm-slim default shell is dash (`sh`); always use bash -euo pipefail.
  debian-script-smoke:
    name: debian bookworm script smoke
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm-slim
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install bash first (container default is dash)
        shell: sh
        run: |
          apt-get update
          apt-get install -y --no-install-recommends bash

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends \
            ca-certificates curl build-essential pkg-config \
            libssl-dev ripgrep python3
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          # shellcheck source=/dev/null
          source "$HOME/.cargo/env"
          rustc --version

      - name: bash -n + VERSION gate + pf-cli test
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "$HOME/.cargo/env"
          bash -n scripts/install.sh
          bash -n scripts/pf_evm_test.sh
          bash -n scripts/pf_solana_test.sh
          bash -n scripts/pf_near_test.sh
          bash -n scripts/pf_cosmwasm_test.sh
          bash -n scripts/pf_near_run.sh
          bash -n scripts/package_bundle_dist.sh
          V="$(tr -d '[:space:]' < VERSION)"
          C="$(awk -F'"' '/^version = / { print $2; exit }' clients/pf-cli/Cargo.toml)"
          test "$V" = "$C"
          # hostMode default present (foreign distro must use dev)
          grep -q 'none => pure \.dev' ProofForgeV2/Materialization/LockedToolchainV1.lean
          cargo test --manifest-path clients/pf-cli/Cargo.toml --locked

  bundle-path-dispatch:
    name: bundle path (dispatch / tag)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install just
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145  # v2.83.1
        with:
          tool: just@1.48.0

      - name: Install Lean
        run: |
          scripts/ci/install-lean.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build compiler
        run: lake build proof_forge_next

      - name: External-author dist smoke (aleo, hostMode=dev)
        env:
          PROOF_FORGE_HOST_MODE: dev
          PROOF_FORGE_EA_TARGET: aleo
        run: bash scripts/external_author_dist_smoke.sh
