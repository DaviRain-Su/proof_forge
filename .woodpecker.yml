# Codeberg Woodpecker CI for proof_forge.
#
# One-time setup (repo owner):
#   1. Request access: https://codeberg.org/Codeberg-e.V./requests/issues/new?template=ISSUE_TEMPLATE%2fWoodpecker-CI.yaml
#   2. Log in at https://ci.codeberg.org with your Codeberg account
#   3. Enable this repo at https://ci.codeberg.org/repos/add
#
# Triggers: push and pull_request (all branches).
# Gates (product-first):
#   1. `just product` — business sources × multi-target (fail fast)
#   2. canonical semantic/parity/boundary gates
#   3. `just check-parallel` — full static baseline through four local lanes

when:
  - event: [push, pull_request]

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 0
      fetch-target-branch: true

steps:
  - name: proof-forge-product
    image: ubuntu:24.04
    commands:
      - export PATH="$HOME/.elan/bin:$HOME/.cargo/bin:$HOME/.foundry/bin:$HOME/.local/bin:$HOME/.local/share/solana/install/active_release/bin:/usr/local/bin:$PATH"
      - scripts/ci/woodpecker-setup.sh
      - just product

  - name: proof-forge-canonical
    image: ubuntu:24.04
    commands:
      - export PATH="$HOME/.elan/bin:$HOME/.cargo/bin:$HOME/.foundry/bin:$HOME/.local/share/solana/install/active_release/bin:/usr/local/bin:$PATH"
      - scripts/ci/woodpecker-setup.sh
      - just canonical-core
      - just canonical-parity
      - just canonical-product
      - just canonical-boundary

  - name: proof-forge-check
    image: ubuntu:24.04
    commands:
      - export PATH="$HOME/.elan/bin:$HOME/.cargo/bin:$HOME/.foundry/bin:$HOME/.local/bin:$HOME/.local/share/solana/install/active_release/bin:/usr/local/bin:$PATH"
      # Setup already ran in product step on the same workspace when sequential;
      # re-run setup for isolated step images.
      - scripts/ci/woodpecker-setup.sh
      - JOBS=4 just check-parallel
      - just wave-t-gate

  # Woodpecker shares this workspace between steps. Package the same Stylus
  # evidence surface uploaded by GitHub Actions; durable publication requires
  # a separately configured Codeberg/S3 artifact sink and credentials.
  - name: proof-forge-stylus-evidence
    image: ubuntu:24.04
    commands:
      - export PATH="$HOME/.elan/bin:$HOME/.cargo/bin:$HOME/.foundry/bin:$HOME/.local/bin:/usr/local/bin:$PATH"
      - just stylus-nitro-doctor || true
      - mkdir -p build/ci-artifacts
      - tar -czf "build/ci-artifacts/stylus-${CI_PIPELINE_NUMBER}.tar.gz" build/stylus build/evidence/stylus build/test-lanes 2>/dev/null || true
      - test -f "build/ci-artifacts/stylus-${CI_PIPELINE_NUMBER}.tar.gz"
    when:
      - status: [success, failure]
