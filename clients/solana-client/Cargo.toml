[package]
name = "proof-forge-solana-client"
version = "0.1.0"
edition = "2021"
publish = false
description = "Offline generic Solana OutputSet verifier for ProofForge product artifacts"
license = "Apache-2.0"
readme = "README.md"

[[bin]]
name = "proof-forge-solana-client"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
libc = "=0.2.189"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"

[dev-dependencies]
tempfile = "3.10"
