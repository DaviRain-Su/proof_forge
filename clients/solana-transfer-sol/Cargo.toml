[package]
name = "solana-transfer-sol"
version = "0.1.0"
edition = "2021"
publish = false
description = "Offline verifier for ProofForge TransferSol product artifacts"
license = "Apache-2.0"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
libc = "=0.2.189"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"

[dev-dependencies]
tempfile = "3.10"
