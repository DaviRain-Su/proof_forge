[package]
name = "proof-forge-pf"
version = "0.1.0"
edition = "2021"
publish = false
description = "ProofForge developer CLI (pf): orchestrates proof-forge-next and official chain tools"
license = "Apache-2.0"
readme = "README.md"

[[bin]]
name = "pf"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
toml = "0.8"
which = "6"

[dev-dependencies]
tempfile = "3.10"
