[package]
name = "proof-forge-solana-runtime-tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "Mollusk runtime differential tests for ProofForge Solana ELF products"
license = "MIT"

[dev-dependencies]
base64 = "0.22"
curve25519-dalek = "4.1.3"
hex = "0.4"
mollusk-svm = "0.13.4"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-account = "3.4.0"
solana-instruction = "3.3.0"
solana-native-token = "3.0.0"
solana-program-error = "3.0.0"
solana-pubkey = { version = "4.1.0", features = ["curve25519"] }
# Feature required: LogCollector is gated behind agave-unstable-api (mollusk enables it).
solana-svm-log-collector = { version = "4.0.0", features = ["agave-unstable-api"] }
