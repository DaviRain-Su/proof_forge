[package]
name = "proof-forge-cosmwasm-runtime-tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "cosmwasm-vm mock-runtime differentials for ProofForge CosmWasm WASM products (engineering only; not wasmd/formal)"
license = "MIT"

[dev-dependencies]
# Prefer cosmwasm-vm over cw-multi-test: mock Backend/Storage/Api/Querier
# exercises the same host import surface (db_*, abort) the product WAT binds,
# without App-level bank/wasm modules. Still not wasmd / real chain.
cosmwasm-std = "=3.0.9"
cosmwasm-vm = { version = "=3.0.9", default-features = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
